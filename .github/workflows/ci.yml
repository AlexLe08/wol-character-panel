name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (includes the import allowlist)
        run: npm run lint

      - name: Type-check (source and tests)
        run: npm run typecheck

      # Fails below the coverage thresholds in vitest.config.ts.
      - name: Tests and coverage
        run: npm test

      # Fails when src/schema.ts changed without `npm run generate:schema`.
      - name: JSON Schema is up to date
        run: |
          npm run generate:schema
          git diff --exit-code character-sheet.schema.json

      - name: Build
        run: npm run build

      # Lists what would be published; prepack builds again.
      - name: Pack
        run: npm pack --dry-run
