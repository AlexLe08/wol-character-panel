name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (includes the import allowlist)
        run: npm run lint

      - name: Type-check (source and tests)
        run: npm run typecheck

      # Fails below the coverage thresholds in vitest.config.ts.
      - name: Tests and coverage
        run: npm test

      # Fails when src/schema.ts changed without `npm run generate:schema`.
      - name: JSON Schema is up to date
        run: |
          npm run generate:schema
          git diff --exit-code character-sheet.schema.json

      - name: Build
        run: npm run build

      # Lists what would be published; prepack builds again.
      - name: Pack
        run: npm pack --dry-run

      # attw (types resolve for each entry) and publint (package.json
      # matches what's packed).
      - name: Package lint
        run: npm run lint:package

      # The tarball installed in a throwaway project, each entry imported
      # in plain Node, with the latest peers.
      - name: Smoke test of the tarball
        run: npm run test:pack

  # The floors: Node 22.12 (`engines`) with the latest peers, and the
  # oldest peers the ranges allow on Node 24. `check` covers Node 24 with
  # the latest peers; lint and the schema don't vary with either.
  compat:
    name: compat (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Node 22.12
            node: "22.12"
          - name: oldest peers
            node: "24"
            oldest-peers: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The lower bounds of peerDependencies in package.json; keep them in
      # step. The smoke test reads its own from package.json.
      - name: Install the oldest peers
        if: matrix.oldest-peers
        run: npm install --no-save react@19.0.0 react-dom@19.0.0 zod@4.0.0

      - name: Type-check
        run: npm run typecheck

      - name: Tests and coverage
        run: npm test

      - name: Smoke test of the tarball
        run: node scripts/smoke-pack.mjs ${{ matrix.oldest-peers && '--oldest-peers' || '' }}

  # Playwright against the playground (playwright.config.ts starts it):
  # hover, focus, Escape, focus rings, layout, axe, and the no-JS page.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The Chromium build this Playwright version expects, and the system
      # libraries it needs.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser

      # The HTML report with traces, for a failed run:
      # `npx playwright show-report <unzipped folder>`. It sits in .logs/,
      # which the action skips unless hidden files are included.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: .logs/playwright-report/
          include-hidden-files: true
          retention-days: 14
