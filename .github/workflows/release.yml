name: Release

# Publishes to npm when a version tag is pushed (`git tag v1.0.1 && git push
# origin v1.0.1`), through npm trusted publishing: npm checks this workflow's
# OIDC token against the package's trusted publisher settings, so no npm
# token is stored anywhere, and adds a provenance attestation itself.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by commit SHA, not tag: this job can publish, and a
      # tag can be moved to other code. Dependabot bumps the SHA and the
      # version comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No dependency cache in the job that can publish: a poisoned cache
      # entry would end up in the release (as in npm's own example).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: npm supports trusted publishing (11.5.1+)
        run: |
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error(`npm ${process.argv[1]} is too old for trusted publishing`);
              process.exit(1);
            }
          ' "$(npm --version)"

      - name: Install dependencies
        run: npm ci

      - name: Checks
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run generate:schema
          git diff --exit-code character-panel.schema.json

      # prepack runs the build.
      - name: Publish
        run: npm publish
